name: Update Migration

on:
permissions:
  actions: read
  contents: read
  packages: read
  pull-requests: read

concurrency:
  group: update-migration-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  update_migration:
    name: Update migration matrix
    if: github.repository == 'openclaw/openclaw'
    uses: ./.github/workflows/package-acceptance.yml
    with:
      workflow_ref: ${{ inputs.workflow_ref || 'main' }}
      source: ref
      package_ref: ${{ inputs.package_ref || 'main' }}
      suite_profile: custom
      docker_lanes: update-migration
      published_upgrade_survivor_baselines: ${{ inputs.baselines || 'supported-lines' }}
      published_upgrade_survivor_scenarios: ${{ inputs.scenarios || 'plugin-deps-cleanup legacy-operator-state' }}
      shared_image_artifact_namespace: update-migration
      shared_image_policy: no-push-artifact
      telegram_mode: none
